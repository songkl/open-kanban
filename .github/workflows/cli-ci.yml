name: CLI CI

on:
  pull_request:
    paths:
      - 'cli/**'
      - '.github/workflows/cli-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'cli/**'
      - '.github/workflows/cli-ci.yml'

permissions:
  contents: read

jobs:
  cli-lint:
    name: CLI Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  cli-test:
    name: CLI Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        # The runner e2e suite spawns the compiled CLI from dist/.
        # Building here keeps cli-test self-contained — the build
        # job downstream still uploads the artifact for release.
        run: npm run build

      - name: Run tests
        # `npm test` runs every vitest file under src/ and tests/.
        # The runner e2e suite lives at tests/e2e/runner.test.ts
        # and is gated by the build above (it depends on dist/
        # existing and the Go helper binary built via `go build`
        # inside the test).
        run: npm test

  cli-build:
    name: CLI Build
    runs-on: ubuntu-latest
    needs: [cli-lint, cli-test]
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test --help
        run: node dist/index.js --help

      - name: Dry-run publish (validate package)
        env:
          DRY_RUN: 'true'
        run: npm publish --dry-run

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: cli/dist
          if-no-files-found: error
          retention-days: 7
